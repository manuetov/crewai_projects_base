[project]
name = "stock_price"
version = "0.1.0"
description = "stock_price using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "gradio>=6.5.1",
    "litellm>=1.75.3",
]

[project.scripts]
stock_price = "stock_price.main:run"
run_crew = "stock_price.main:run"
train = "stock_price.main:train"
replay = "stock_price.main:replay"
test = "stock_price.main:test"
run_with_trigger = "stock_price.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
