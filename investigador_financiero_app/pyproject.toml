[project]
name = "investigador_financiero_app"
version = "0.1.0"
description = "investigador_financiero_app using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai[tools]==1.9.3",
    "email-validator>=2.3.0",
    "fastapi>=0.129.0",
    "litellm>=1.75.3",
]

[project.scripts]
investigador_financiero_app = "investigador_financiero_app.main:run"
run_crew = "investigador_financiero_app.main:run"
train = "investigador_financiero_app.main:train"
replay = "investigador_financiero_app.main:replay"
test = "investigador_financiero_app.main:test"
run_with_trigger = "investigador_financiero_app.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
