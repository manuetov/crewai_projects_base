design_task:
  description: >
    Toma los requisitos de alto nivel descritos aquí y prepara un diseño detallado para el ingeniero;
    todo debe estar en un solo módulo de Python, pero describe las clases y métodos en el módulo.
    Aquí están los requisitos: {requirements}
    IMPORTANTE: Solo entrega el diseño en formato markdown, detallando las clases y funciones del módulo y describiendo su funcionalidad.
  expected_output: >
    Un diseño detallado para el ingeniero, identificando las clases y funciones en el módulo.
  agent: engineering_lead
  output_file: generated-apps/{base_name}_design.md

code_task:
  description: >
    Escribe un módulo de Python que implemente el diseño descrito por el líder de ingeniería, para cumplir con los requisitos.
    Aquí están los requisitos: {requirements}
    IMPORTANTE: todas las dependencias (gradio, etc.) ya están instaladas en el entorno. NO incluyas ninguna llamada a pip,
    subprocess ni instalación de paquetes. Importa las librerías directamente al inicio del módulo.
  expected_output: >
    Un módulo de Python que implemente el diseño y cumpla con los requisitos.
    IMPORTANTE: Entrega ÚNICAMENTE el código Python sin ningún formato markdown, delimitadores de bloque de código ni comillas invertidas.
    La salida debe ser código Python válido que pueda guardarse directamente en un archivo y ejecutarse.
  agent: backend_engineer
  context:
    - design_task
  output_file: generated-apps/{module_name}

frontend_task:
  description: >
    Escribe una interfaz de usuario con gradio en un módulo llamado app.py que demuestre la clase backend proporcionada en {module_name}.
    Supón que solo hay 1 usuario y mantén la interfaz lo más simple posible: solo un prototipo o demostración.
    Aquí están los requisitos: {requirements}
  expected_output: >
    Una interfaz de usuario con gradio en el módulo app.py que demuestre la clase backend dada.
    El archivo debe estar listo para ejecutarse tal cual, en el mismo directorio que el módulo backend, e importar la clase backend desde {module_name}.
    IMPORTANTE: Entrega ÚNICAMENTE el código Python sin ningún formato markdown, delimitadores de bloque de código ni comillas invertidas.
    La salida debe ser código Python válido que pueda guardarse directamente en un archivo y ejecutarse.
  agent: frontend_engineer
  context:
    - code_task
  output_file: generated-apps/app.py

test_task:
  description: >
    Escribe pruebas unitarias para el módulo backend proporcionado {module_name} y crea un archivo test_{module_name} 
    en el mismo directorio que el módulo backend.
  expected_output: >
    Un módulo test_{module_name} que prueba el módulo backend dado.
    IMPORTANTE: Entrega ÚNICAMENTE el código Python sin ningún formato markdown, delimitadores de bloque de código ni comillas invertidas.
    La salida debe ser código Python válido que pueda guardarse directamente en un archivo y ejecutarse.
  agent: test_engineer
  context:
    - code_task
  output_file: generated-apps/test_{module_name}

docs_task:
  description: >
    Eres el Ingeniero de Documentación del proyecto {module_name}.
    Ya existe el módulo backend, puede existir también un frontend (app.py) y tests (test_{module_name}).
    Tu tarea es generar un archivo INSTRUCTIONS.md que sirva como guía completa del proyecto.

    El archivo debe contener las siguentes secciones (en este orden):
    1. **Propósito** — qué hace el proyecto y cuál es su clase principal ({class_name}).
    2. **Stack tecnológico** — Python, librerías, Gradio si existe frontend.
    3. **Estructura de archivos** — lista los archivos en generated-apps/ y describe el rol de cada uno.
    4. **Instalación** — cómo instalar dependencias (`pip install -r requirements.txt` o similar).
    5. **Ejecución** — cómo ejecutar el módulo y el frontend si existe.
    6. **Tests** — cómo correr los tests (`python -m pytest test_{module_name}` o similar).
    7. **Convenciones** — nomenclatura, estilo de código.
    8. **Notas para IA** — qué archivos son entry points, cuáles no deben modificarse, cómo extender.

    Aquí están los requisitos originales del proyecto para contexto: {requirements}
  expected_output: >
    Un archivo INSTRUCTIONS.md completo en formato Markdown, con las 8 secciones descritas.
    Debe estar listo para ser leído por un desarrollador o un agente de IA que abra el proyecto.
  agent: docs_engineer
  context:
    - code_task
  output_file: generated-apps/INSTRUCTIONS.md
